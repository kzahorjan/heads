:#222}.setting output{font-size:11px;min-width:32px;color:#171717;font-variant-numeric:tabular-nums}.settings button{font:inherit;font-size:12px;border:1px solid #ddd;background:#fff;padding:9px 13px;cursor:pointer;border-radius:3px}.settings button:hover{background:#f4f4f4}.foot{font-size:11px;color:#999;margin:14px 0 0}@media(max-width:650px){.shell{padding:15px}.stage{min-height:368px;aspect-ratio:4/4.83}.settings{gap:12px}.setting input{width:75px}.hint{display:none}.label strong{font-size:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important}}

</style></head><body><main class="shell"><div class="top"><div class="mode-switch" role="group" aria-label="Režim náhľadu"><button type="button" class="mode active" data-mode="desktop" aria-pressed="true">Desktop</button><button type="button" class="mode" data-mode="mobile" aria-pressed="false">Mobil</button></div></div><div class="preview-wrap"><section class="stage" id="stage" aria-label="Interaktívna mapa tímu" tabindex="0"><div class="cloud" id="cloud"></div></section></div><p class="scroll-tip" id="scrollTip">Posúvaj obsah horizontálne ← → · hlavy sa automaticky pohybujú horizontálne</p><div class="settings"><label class="setting">Počet <input id="count" type="range" min="24" max="120" value="84"><output id="countValue"></output></label><label class="setting">Offset <input id="offset" type="range" min="0" max="150" value="78"><output id="offsetValue"></output></label><label class="setting">Pohyb <input id="motion" type="range" min="0" max="100" step="5" value="20"><output id="motionValue">20%</output></label><button id="shuffle" type="button">Premiešať rozloženie ↻</button></div><p class="foot">Desktop aj mobil: nekonečný horizontálny pohyb · Mobil: manuálny horizontálny scroll</p></main><script>
const stage=document.querySelector('#stage'),cloud=document.querySelector('#cloud'),shell=document.querySelector('.shell');const count=document.querySelector('#count'),offset=document.querySelector('#offset');const names=['Alex Novák','Sofia Kováčová','Martin Polák','Emma Horváthová','Oliver Urban','Nina Králová','Adam Benko','Laura Šimková','Jakub Varga','Mia Balážová','Tomáš Kováč','Ema Farkašová'];const roles=['Product Designer','UX Researcher','Design Lead','Frontend Developer','Strategist','Art Director'];const tones=['#a9a9a9','#b5b5b5','#c1c1c1','#999999','#adadad','#c9c9c9','#a3a3a3'];let seed=17,lastWidth=0,lastHeight=0;const motion=document.querySelector('#motion');let autoScrollFrame=0,lastTick=0,scrollPauseUntil=0,desktopTravel=0,desktopItems=[];function random(i,s){const v=Math.sin(i*127.1+s*311.7)*43758.5453;return v-Math.floor(v)}function draw(){
 const w=cloud.clientWidth,h=cloud.clientHeight;if(!w||!h)return;
 const n=+count.value,aspect=w/h;
 const cols=Math.max(5,Math.ceil(Math.sqrt(n*aspect*1.08))),rows=Math.ceil(n/cols);
 const padX=0,padY=h*.065,cellW=w/cols,cellH=(h-2*padY)/rows;
 // Leave a little breathing room for strong, non-uniform displacement.
 const d=Math.min(cellW,cellH)*(shell.classList.contains('mobile-preview')?.77:.68), gap=Math.max(1.5,d*.065);
 const intensity=+offset.value/100;
 const points=[];
 for(let i=0;i<n;i++){
   const row=Math.floor(i/cols),col=i%cols;
   const x=padX+col*cellW+cellW/2;
   const y=padY+row*cellH+cellH/2;
   // A broad two-axis jitter, with a secondary wave that breaks visible rows.
   const dx=(random(i+19,seed)*2-1)*cellW*.63*intensity;
   const dy=(random(i+811,seed)*2-1)*cellH*.76*intensity;
   const wave=Math.sin(col*1.73+row*.91+seed*.2)*cellH*.19*intensity;
   points.push({x:((x+dx)%w+w)%w,y:Math.max(d/2+gap,Math.min(h-d/2-gap,y+dy+wave))});
 }
 // Deterministic circle relaxation: preserve the scattered feel, prevent overlap.
 const minDist=d+gap;
 for(let pass=0;pass<110;pass++){
   let moved=false;
   for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
     let dx=points[j].x-points[i].x,dy=points[j].y-points[i].y;
     if(dx>w/2)dx-=w;else if(dx<-w/2)dx+=w;
     let dist=Math.hypot(dx,dy);
     if(dist>=minDist)continue;
     if(dist<.0001){const angle=random(i*177+j,seed)*Math.PI*2;dx=Math.cos(angle);dy=Math.sin(angle);dist=1;}
     const push=(minDist-dist)*.52;
     const ux=dx/dist,uy=dy/dist;
     points[i].x-=ux*push;points[i].y-=uy*push;
     points[j].x+=ux*push;points[j].y+=uy*push;moved=true;
   }
   for(const p of points){p.x=((p.x%w)+w)%w;p.y=Math.max(d/2+gap,Math.min(h-d/2-gap,p.y));}
   if(!moved)break;
 }
 // Use periodic X coordinates in both modes. Edge-crossing circles are
 // represented by neighboring copies, so there is no seam or empty reset frame.
 const finalD=d;
 cloud.style.setProperty('--zoom','1.65');
 desktopItems=[];
 cloud.innerHTML='';const fragment=document.createDocumentFragment();
 for(let i=0;i<n;i++){
  const {x,y}=points[i],name=names[i%names.length],role=roles[(i*5)%roles.length];
  const btn=document.createElement('button');btn.className='person';btn.type='button';
  btn.style.cssText=`--d:${finalD}px;--x:${x-finalD/2}px;--y:${y-finalD/2}px;--shade:${tones[(i*7+Math.floor(random(i,seed)*4))%tones.length]};--feature:#777`;
  desktopItems.push({el:btn,x:x-finalD/2,y:y-finalD/2,d:finalD,copies:[]});
  btn.setAttribute('aria-label',name+', '+role);
  btn.innerHTML=`<span class="head" aria-hidden="true"></span><span class="label"><strong>${name}</strong><small>${role}</small></span>`;
  fragment.appendChild(btn);
 }
 cloud.appendChild(fragment);
 // Always create neighboring tiles, including on mobile. Mobile's viewport
 // is horizontally scrollable, while the people drift horizontally.
 const copies=document.createDocumentFragment();
 for(const item of desktopItems){
  for(const direction of [-1,1]){
   const clone=item.el.cloneNode(true);
   clone.setAttribute('aria-hidden','true');clone.tabIndex=-1;
   clone.style.setProperty('--x',(item.x+direction*w)+'px');
   item.copies.push({el:clone,direction});copies.appendChild(clone);
  }
 }
 cloud.appendChild(copies);
 document.querySelector('#countValue').textContent=n;
 document.querySelector('#offsetValue').textContent=offset.value+'%';applyMotion();
}
function applyMotion(){
 const value=+motion.value;
 document.querySelector('#motionValue').textContent=value===0?'Vyp.':value+'%';
}
function autoScroll(t){
 const dt=lastTick?Math.min(64,t-lastTick):0;lastTick=t;
 const value=+motion.value;
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 // 100% is deliberately as slow as the former 10% setting (~0.022px/ms).
 const speed=value*.00022;
 if(!reduced && value>0 && t>scrollPauseUntil) desktopTravel+=speed*dt;
 const w=cloud.clientWidth;
 if(w>0){
  const travel=((desktopTravel%w)+w)%w;
  for(const item of desktopItems){
   // Wrap each head independently, instead of waiting for an entire tile.
   const x=((item.x+travel)%w+w)%w;
   item.el.style.setProperty('--x',x+'px');
   for(const copy of item.copies){
    copy.el.style.setProperty('--x',(x+copy.direction*w)+'px');
   }
  }
 }
 autoScrollFrame=requestAnimationFrame(autoScroll);
}
// Manual scrolling never stops the ambient horizontal drift.

motion.addEventListener('input',applyMotion);applyMotion();requestAnimationFrame(autoScroll);
[count,offset].forEach(x=>x.addEventListener('input',draw));document.querySelector('#shuffle').addEventListener('click',()=>{seed++;draw()});new ResizeObserver(()=>{const w=cloud.clientWidth,h=cloud.clientHeight;if(w!==lastWidth||h!==lastHeight){lastWidth=w;lastHeight=h;draw()}}).observe(stage);document.querySelectorAll('.mode').forEach(btn=>btn.addEventListener('click',()=>{const mobile=btn.dataset.mode==='mobile';shell.classList.toggle('mobile-preview',mobile);document.querySelectorAll('.mode').forEach(b=>{const active=b===btn;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});if(mobile){stage.scrollLeft=0;stage.scrollTop=0;}requestAnimationFrame(draw);}));draw();
